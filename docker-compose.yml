version: '3.8'

services:
  router:
    build:
      context: .
      dockerfile: Dockerfile.router
    ports:
      - "8000:8000"
    depends_on:
      - service-a
      - service-b
      - service-c

  service-a:
    build:
      context: .
      dockerfile: Dockerfile.service
    environment:
      - SERVICE_NAME=service-a
      - PORT=8080
    ports:
      - "8081:8080"

  service-b:
    build:
      context: .
      dockerfile: Dockerfile.service
    environment:
      - SERVICE_NAME=service-b
      - PORT=8080
    ports:
      - "8082:8080"

  service-c:
    build:
      context: .
      dockerfile: Dockerfile.service
    environment:
      - SERVICE_NAME=service-c
      - PORT=8080
    ports:
      - "8083:8080"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=fabric
    ports:
      - "5432:5432"
